name: Build AURIX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          
      - name: Install Gradle
        run: |
               curl -L \
               -o gradle.zip \
               https://services.gradle.org/distributions/gradle-8.9-bin.zip
 
                unzip -q gradle.zip \
                 -d "$HOME/gradle"

                 echo "$HOME/gradle/gradle-8.9/bin" \
               >> "$GITHUB_PATH"

      - name: Build Debug APK
        run: |
         gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-debug
          path: app/build/outputs/apk/debug/app-debug.apk
