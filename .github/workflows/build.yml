name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Organize Android Structure
        run: |
          mkdir -p app/src/main/java/com/example/myaiassistant
          mkdir -p app/src/main/res/values
          
          # Move files to correct Android paths if they are in root
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/example/myaiassistant/
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f styles.xml ] && mv styles.xml app/src/main/res/values/
          [ -f build.gradle.kts ] && cp build.gradle.kts app/

      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-Assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
