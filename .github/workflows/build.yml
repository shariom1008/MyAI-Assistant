name: Build AURIX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # -------------------------------------------------
      # JAVA 17
      # -------------------------------------------------

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # -------------------------------------------------
      # INSTALL GRADLE
      # -------------------------------------------------

      - name: Install Gradle
        run: |
          curl -L \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.9/bin" \
            >> "$GITHUB_PATH"


      # -------------------------------------------------
      # CREATE PERMANENT KEYSTORE
      # -------------------------------------------------

      - name: Restore AURIX signing keystore
        env:
          AURIX_KEYSTORE_BASE64: ${{ secrets.AURIX_KEYSTORE_BASE64 }}
        run: |
          echo "$AURIX_KEYSTORE_BASE64" | base64 --decode > aurix-signing.jks

          test -s aurix-signing.jks

          echo "AURIX signing keystore restored successfully."


      # -------------------------------------------------
      # BUILD RELEASE APK
      # -------------------------------------------------

      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          gradle assembleRelease \
            -PGEMINI_API_KEY="$GEMINI_API_KEY" \
            -PYOUTUBE_API_KEY="$YOUTUBE_API_KEY" \
            --stacktrace


      # -------------------------------------------------
      # FIND ANDROID BUILD TOOLS
      # -------------------------------------------------

      - name: Find Android build tools
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "Using build tools:"
          echo "$BUILD_TOOLS"


      # -------------------------------------------------
      # ZIPALIGN RELEASE APK
      # -------------------------------------------------

      - name: Zipalign APK
        run: |
          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk


      # -------------------------------------------------
      # SIGN APK
      # -------------------------------------------------

      - name: Sign APK
        env:
          AURIX_KEYSTORE_PASSWORD: ${{ secrets.AURIX_KEYSTORE_PASSWORD }}
          AURIX_KEY_PASSWORD: ${{ secrets.AURIX_KEY_PASSWORD }}
          AURIX_KEY_ALIAS: ${{ secrets.AURIX_KEY_ALIAS }}
        run: |
          "$BUILD_TOOLS/apksigner" sign \
            --ks aurix-signing.jks \
            --ks-key-alias "$AURIX_KEY_ALIAS" \
            --ks-pass env:AURIX_KEYSTORE_PASSWORD \
            --key-pass env:AURIX_KEY_PASSWORD \
            --out AURIX-release.apk \
            app-release-aligned.apk


      # -------------------------------------------------
      # VERIFY SIGNATURE
      # -------------------------------------------------

      - name: Verify APK signature
        run: |
          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            AURIX-release.apk


      # -------------------------------------------------
      # SHOW FINAL SHA-1
      # -------------------------------------------------

      - name: Show final APK SHA-1
        run: |
          echo "======================================"
          echo "AURIX FINAL RELEASE APK SHA-1"
          echo "======================================"

          keytool \
            -printcert \
            -jarfile AURIX-release.apk \
            | grep -i "SHA1:"


      # -------------------------------------------------
      # UPLOAD FINAL APK
      # -------------------------------------------------

      - name: Upload AURIX Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-release
          path: AURIX-release.apk
