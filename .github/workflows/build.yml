name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q MyAI_Assistant_V1_PHONE_BUILD.zip

      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Fix JVM target and Java Version
        working-directory: MyAI_Assistant_V1
        run: |
          find . -name "build.gradle" -o -name "build.gradle.kts" | while read file; do
            sed -i 's/1.8/17/g' "$file"
            sed -i 's/"1.8"/"17"/g' "$file"
            sed -i "s/'1.8'/'17'/g" "$file"
            sed -i 's/VERSION_1_8/VERSION_17/g' "$file"
          done

      - name: Build APK
        working-directory: MyAI_Assistant_V1
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-Assistant-debug
          path: MyAI_Assistant_V1/app/build/outputs/apk/debug/app-debug.apk
          
