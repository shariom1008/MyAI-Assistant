name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q MyAI_Assistant_V1_PHONE_BUILD.zip

      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Fix JVM target and Java Version with Python
        working-directory: MyAI_Assistant_V1
        run: |
          python3 -c '
          import os
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".gradle") or file.endswith(".gradle.kts"):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      content = content.replace("1.8", "17")
                      content = content.replace("VERSION_1_8", "VERSION_17")
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
          print("Gradle files updated successfully!")
          '

      - name: Build APK
        working-directory: MyAI_Assistant_V1
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-Assistant-debug
          path: MyAI_Assistant_V1/app/build/outputs/apk/debug/app-debug.apk
